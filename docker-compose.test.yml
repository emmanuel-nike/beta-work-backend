services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betawork
      POSTGRES_PASSWORD: betawork
      POSTGRES_DB: betawork_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U betawork -d betawork_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: error
      APP_KEY: averylongtestappkeyforbetawork123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: betawork
      DB_PASSWORD: betawork
      DB_DATABASE: betawork_test
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['npm', 'test']
