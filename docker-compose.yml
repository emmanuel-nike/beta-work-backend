services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betawork
      POSTGRES_PASSWORD: betawork
      POSTGRES_DB: betawork
    ports:
      - '5432:5432'
    volumes:
      - betawork_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U betawork -d betawork']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: betawork
      DB_PASSWORD: betawork
      DB_DATABASE: betawork
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3333:3333'
    volumes:
      - ./:/app
      - /app/node_modules
      - betawork_uploads_dev:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "node ace migration:run --force &&
             npm run dev"

volumes:
  betawork_pg_dev:
  betawork_uploads_dev:
