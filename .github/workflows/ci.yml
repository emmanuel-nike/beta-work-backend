name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: betawork
          POSTGRES_PASSWORD: betawork
          POSTGRES_DB: betawork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betawork -d betawork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          HOST: 0.0.0.0
          PORT: 3333
          LOG_LEVEL: error
          APP_KEY: averylongtestappkeyforbetawork123
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: betawork
          DB_PASSWORD: betawork
          DB_DATABASE: betawork_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
        run: npm test
